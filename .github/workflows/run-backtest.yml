name: Run Backtests

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Period: 6m, 1y, or 3y'
        required: true
        default: '6m'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_URL: ${{ secrets.VERCEL_APP_URL }}
      TRADING_SECRET: ${{ secrets.TRADING_SECRET }}
      PERIOD: ${{ github.event.inputs.period }}
    steps:
      - name: Run backtest
        run: |
          set -e
          if [ "$PERIOD" = "6m" ]; then
            CHUNKS=1
          elif [ "$PERIOD" = "1y" ]; then
            CHUNKS=4
          else
            CHUNKS=12
          fi

          if [ "$CHUNKS" = "1" ]; then
            echo "Running 6m single-shot..."
            curl -sf -X POST "${APP_URL}/api/trading/backtest?period=${PERIOD}" \
              -H "x-trading-secret: ${TRADING_SECRET}" | python3 -m json.tool
          else
            for i in $(seq 1 $CHUNKS); do
              echo "=== Chunk $i / $CHUNKS ==="
              curl -sf -X POST "${APP_URL}/api/trading/backtest?period=${PERIOD}&chunk=${i}" \
                -H "x-trading-secret: ${TRADING_SECRET}" | python3 -m json.tool || echo "chunk $i failed"
              sleep 30
            done
            echo "=== Merging ==="
            curl -sf -X POST "${APP_URL}/api/trading/backtest?period=${PERIOD}&chunk=merge" \
              -H "x-trading-secret: ${TRADING_SECRET}" | python3 -m json.tool
          fi
