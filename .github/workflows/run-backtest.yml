name: Run Backtests

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Period: 6m, 1y, or 3y'
        required: true
        default: '6m'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_URL: ${{ secrets.VERCEL_APP_URL }}
      TRADING_SECRET: ${{ secrets.TRADING_SECRET }}
      PERIOD: ${{ github.event.inputs.period }}
    steps:
      - name: Run backtest
        run: |
          if [ "$PERIOD" = "6m" ]; then
            CHUNKS=1
          elif [ "$PERIOD" = "1y" ]; then
            CHUNKS=4
          else
            CHUNKS=12
          fi

          if [ "$CHUNKS" = "1" ]; then
            echo "Running ${PERIOD} single-shot..."
            curl -s -X POST "${APP_URL}/api/trading/backtest?period=${PERIOD}" \
              -H "x-trading-secret: ${TRADING_SECRET}" | python3 -m json.tool
          else
            for i in $(seq 1 $CHUNKS); do
              echo "=== Chunk $i / $CHUNKS ==="
              curl -s -X POST "${APP_URL}/api/trading/backtest?period=${PERIOD}&chunk=${i}" \
                -H "x-trading-secret: ${TRADING_SECRET}" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print(f'  days={d.get(\"tradingDays\")} trades={d.get(\"totalTrades\")} pnl={d.get(\"totalPnL\")} msg={d.get(\"message\",\"\")[:60]}')
except: print('  parse error')
"
              sleep 35
            done
            echo "=== Merging all ${CHUNKS} chunks ==="
            curl -s -X POST "${APP_URL}/api/trading/backtest?period=${PERIOD}&chunk=merge" \
              -H "x-trading-secret: ${TRADING_SECRET}" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('FINAL RESULT:')
  print(f'  Period={d.get(\"period\")} Days={d.get(\"tradingDays\")} Trades={d.get(\"totalTrades\")} WinRate={d.get(\"winRate\")}% PnL={d.get(\"totalPnL\")}')
  print('Top conditions (best win rates):')
  for c in (d.get('topStocks') or [])[:5]:
    print(f'  {c}')
except Exception as e: print(f'  merge parse error: {e}')
"
          fi
