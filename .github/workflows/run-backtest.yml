name: Run Backtests

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Period: 6m, 1y, or 3y'
        required: true
        default: '6m'
      action:
        description: 'Action: run (default) or merge-only'
        required: false
        default: 'run'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_URL: ${{ secrets.VERCEL_APP_URL }}
      TRADING_SECRET: ${{ secrets.TRADING_SECRET }}
      PERIOD: ${{ github.event.inputs.period }}
      ACTION: ${{ github.event.inputs.action }}
    steps:
      - name: Run backtest
        run: |
          call_api() {
            curl -s --max-time 290 -X POST "$1" -H "x-trading-secret: ${TRADING_SECRET}" \
              | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  keys=['chunk','tradingDays','totalTrades','winRate','totalPnL','message']
  for k in keys:
    if k in d: print(f'  {k}={d[k]}')
except Exception as e: print(f'  error: {e}')
"
          }

          if [ "$ACTION" = "merge-only" ]; then
            echo "=== Merge only: ${PERIOD} ==="
            call_api "${APP_URL}/api/trading/backtest?period=${PERIOD}&chunk=merge"
            exit 0
          fi

          if [ "$PERIOD" = "6m" ]; then
            CHUNKS=1
          elif [ "$PERIOD" = "1y" ]; then
            CHUNKS=4
          else
            CHUNKS=12
          fi

          if [ "$CHUNKS" = "1" ]; then
            echo "=== Running ${PERIOD} (single shot) ==="
            call_api "${APP_URL}/api/trading/backtest?period=${PERIOD}"
          else
            for i in $(seq 1 $CHUNKS); do
              echo "=== Chunk $i / $CHUNKS ==="
              call_api "${APP_URL}/api/trading/backtest?period=${PERIOD}&chunk=${i}"
              sleep 35
            done
            echo "=== Merging ==="
            call_api "${APP_URL}/api/trading/backtest?period=${PERIOD}&chunk=merge"
          fi
